<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatamWay — Eco-Runner Batam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1B4FD8;--blue-mid:#2563EB;--blue-light:#EFF4FF;--blue-glow:rgba(37,99,235,0.18);
  --teal:#0D9488;--teal-light:#F0FDFA;--amber:#F59E0B;--amber-light:#FFFBEB;
  --rose:#F43F5E;--violet:#7C3AED;--ink:#0D1526;--ink-2:#374151;--ink-3:#6B7280;--ink-4:#9CA3AF;
  --surface:#FFFFFF;--surface-2:#F8FAFD;--border:#E5E9F2;--border-2:#D1D9E8;--r-sm:8px;--r-md:14px;--r-lg:20px;--r-full:999px;
  --sh-sm:0 1px 4px rgba(13,21,38,0.07);--sh-md:0 4px 20px rgba(13,21,38,0.10);--sh-lg:0 12px 40px rgba(13,21,38,0.13);--sh-blue:0 6px 24px rgba(37,99,235,0.22);
  --nav-h:68px;
}
html{scroll-behavior:smooth;height:100%;}
body{font-family:'Sora',sans-serif;background:#070916;color:var(--ink);line-height:1.6;min-height:100vh;height:100%;overflow:hidden}
#game-shell{min-height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:#070916;}
#game-area{position:relative;width:100%;height:100%;overflow:hidden;}
#gameCanvas{width:100%;height:100%;display:block;}
.hud{position:absolute;top:18px;left:18px;display:flex;gap:12px;z-index:15;flex-wrap:wrap;}
.hud-item{background:rgba(6,8,20,.88);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);padding:12px 16px;border-radius:18px;min-width:118px;color:#f8fafc;box-shadow:0 12px 30px rgba(0,0,0,.18);}
.hud-item span{display:block;font-size:11px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.hud-item strong{display:block;font-size:18px;font-weight:800;}
.back-link{position:absolute;top:18px;right:18px;z-index:15;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:white;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;transition:all .2s;}
.back-link:hover{background:rgba(255,255,255,.18);}
.g-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:rgba(7,9,26,0.88);backdrop-filter:blur(10px);z-index:20;transition:opacity .3s,visibility .3s}
.overlay-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:1rem;}
.btn-primary, .btn-nl{min-width:150px;}
.btn-nl{padding:10px 18px;}
nav{background-color: rgba(6, 8, 15, 0.60);backdrop-filter: blur(6px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:300;padding:0 2rem}
.nav-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:var(--nav-h)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo-img-slot{width:40px;height:40px;border-radius:12px;border:2px dashed rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,0.06);flex-shrink:0;cursor:default;transition:border-color .2s}
.logo-img-slot:hover{border-color:var(--blue-mid)}
.logo-img-slot img{width:100%;height:100%;object-fit:cover;display:block;background:transparent}
.logo-mark{width:40px;height:40px;background:linear-gradient(135deg,var(--blue) 0%,#4F8EF7 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-blue)}
.logo-mark svg{width:22px;height:22px;fill:white}
.logo-text{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:800;color:var(--blue-mid);letter-spacing:-0.5px}
.logo-text span{color:var(--amber)}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none}
.nav-links a{font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.92);text-decoration:none;padding:7px 14px;border-radius:var(--r-sm);transition:all .2s;cursor:pointer;border-bottom:2px solid transparent}
.nav-links a:hover{color:rgba(255,255,255,0.98);background:rgba(255,255,255,0.04)}
.nav-links a.active{color:var(--blue-mid);background:rgba(37,99,235,0.16);font-weight:700;border-bottom-color:var(--blue-mid)}
.nav-right{display:flex;gap:8px;align-items:center}
.nav-points{display:flex;align-items:center;gap:6px;background:var(--amber-light);border:1px solid #FDE68A;padding:6px 13px;border-radius:var(--r-full);font-size:13px;font-weight:700;color:#92400E;cursor:pointer}
.btn-nl{padding:8px 18px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;cursor:pointer;background:transparent;border:1.5px solid var(--border-2);color:white;font-family:'Sora',sans-serif;transition:all .2s;white-space:nowrap}
.btn-nl:hover{border-color:var(--blue-mid);color:var(--blue-mid)}
.btn-ns{padding:8px 20px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;cursor:pointer;background:var(--blue-mid);border:none;color:white;font-family:'Sora',sans-serif;box-shadow:var(--sh-blue);transition:all .2s}
.btn-ns:hover{background:var(--blue);transform:translateY(-1px)}
.g-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:rgba(7,9,26,0.88);backdrop-filter:blur(10px);z-index:20;transition:opacity .3s,visibility .3s}
.g-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.g-overlay.visible{opacity:1;visibility:visible;pointer-events:auto}
@keyframes goSlideIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.g-over-content{animation:goSlideIn .4s cubic-bezier(.16,1,.3,1) forwards;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
.btn-primary{padding:12px 24px;border-radius:999px;border:none;background:linear-gradient(135deg,#2563EB,#1E40AF);color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 6px 18px rgba(37,99,235,.28);transition:all .2s;white-space:nowrap}
.btn-primary:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div id="game-shell">
  <div id="game-area">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="hud-item"><span>Skor</span><strong id="g-score">0</strong></div>
      <div class="hud-item"><span>Poin</span><strong id="g-poin">0</strong></div>
      <div class="hud-item"><span>Rekor</span><strong id="g-best-h">0</strong></div>
    </div>
    <div id="g-start" class="g-overlay visible">
      <div class="g-over-content" style="max-width:420px;text-align:center;">
        <div style="font-size:52px;line-height:1">🚦</div>
        <div style="font-size:24px;font-weight:800;color:white">Siap berlari?</div>
        <p style="font-size:14px;color:rgba(255,255,255,.74);line-height:1.8">Tekan play untuk mulai, lalu gunakan Space / panah atas untuk lompat dan panah bawah untuk slam/jongkok.</p>
        <button class="btn-primary" onclick="gameStart()">Mainkan Sekarang</button>
        <div style="font-size:13px;color:rgba(255,255,255,.55);">Klik atau sentuh area game untuk lompat juga.</div>
      </div>
    </div>
    <div id="g-over" class="g-overlay hidden">
      <div class="g-over-content" style="max-width:420px;text-align:center;">
        <div id="g-over-emoji" style="font-size:46px;line-height:1">💥</div>
        <div id="g-over-title" style="font-size:24px;font-weight:800;color:white">Game Over</div>
        <p id="g-over-msg" style="font-size:14px;color:rgba(255,255,255,.72);line-height:1.8">Kamu bisa lebih baik lagi!</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:left">
          <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;">
            <div style="font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Skor</div>
            <div id="g-final" style="font-size:20px;font-weight:800;color:white">0</div>
          </div>
          <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;">
            <div style="font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Poin</div>
            <div id="g-earned" style="font-size:20px;font-weight:800;color:#16A34A">0</div>
          </div>
        </div>
        <div style="margin-top:1rem;font-size:12px;color:rgba(255,255,255,.55);">Rekor terbaik: <span id="g-best" style="font-weight:700;color:#FCD34D">0</span></div>
        <div class="overlay-actions">
          <button class="btn-primary" onclick="gameRestart()">Mainkan Lagi</button>
          <a class="btn-nl" href="gamifikasi.html">Kembali ke Dashboard</a>
        </div>
      </div>
    </div>
    <a class="btn-nl back-link" href="gamifikasi.html">Kembali</a>
  </div>
</div>
<script>
function showOverlay(id){
  const el=document.getElementById(id);
  el.classList.remove('hidden'); el.classList.add('visible');
  const c=el.querySelector('.g-over-content');
  if(c){c.style.animation='none';void c.offsetWidth;c.style.animation='';}
}
function hideOverlay(id){
  const el=document.getElementById(id);
  el.classList.remove('visible'); el.classList.add('hidden');
}
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W,H,dpr,RAF;
let gameRunning=false, gamePhase='idle';
let score=0, bestScore=0, sessionPoin=0;
let speed, spawnTimer, spawnInterval;
let obstacles=[], buildings=[], stars=[], particles=[], laneMarkers=[];
let busX=0, busVisible=false, busTimer=0;
const GRAVITY   = 0.58;
const JUMP_FORCE = -14;
const SLAM_VEL  = 22;
const NORMAL_H  = 56;
const DUCK_H    = 30;
const CHAR_W    = 34;
let player, groundY;
const OBS = {
  car:     { w:130, h:72  },
  truck:   { w:175, h:88  },
  barrier: { w:160, h:20  }
};
function initGame(){
  const area=document.getElementById('game-area');
  const rect=area.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=rect.width||900; H=rect.height||450;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  groundY=H*0.72;
  player={x:W*0.12,y:0,w:CHAR_W,h:NORMAL_H,vy:0,onGround:true,ducking:false,slamming:false,jumpCount:0};
  resetPlayer(); initBg(); drawIdle();
}
function resetPlayer(){
  player.y=groundY-player.h;
  player.vy=0; player.onGround=true;
  player.ducking=false; player.slamming=false; player.jumpCount=0;
  player.h=NORMAL_H; player.w=CHAR_W;
}
function initBg(){
  stars=[];
  for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*groundY*.7,r:Math.random()*1.5+.3,a:Math.random()});
  buildings=[]; let bx=0;
  while(bx<W+200){const bh=60+Math.random()*150,bw=44+Math.random()*70;buildings.push({x:bx,w:bw,h:bh});bx+=bw+6+Math.random()*10;}
  laneMarkers=[];
  for(let i=0;i<12;i++) laneMarkers.push({x:i*120});
  obstacles=[]; particles=[];
  speed=5.5; spawnTimer=0; spawnInterval=90;
  busX=W+200; busVisible=false; busTimer=0;
}
function drawIdle(){
  if(!canvas||!ctx) return; initBg();
  ctx.clearRect(0,0,W,H);
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#040814'); sg.addColorStop(1,'#111827');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
}
function gameStart(){
  hideOverlay('g-start'); hideOverlay('g-over');
  score=0; sessionPoin=0; gameRunning=true; gamePhase='running';
  initBg(); resetPlayer();
  document.getElementById('g-score').textContent='0';
  document.getElementById('g-poin').textContent='0';
  if(RAF) cancelAnimationFrame(RAF);
  lastTime=0; RAF=requestAnimationFrame(gameLoop);
}
function gameRestart(){ hideOverlay('g-over'); gameStart(); }
function gameOver(){
  if(!gameRunning) return;
  gameRunning=false; gamePhase='dead';
  cancelAnimationFrame(RAF);
  spawnDeathPfx(); render();
  const earned=Math.floor(score/100);
  sessionPoin+=earned;
  if(score>bestScore){ bestScore=score; document.getElementById('g-best-h').textContent=bestScore; }
  document.getElementById('g-final').textContent=score;
  document.getElementById('g-earned').textContent=earned;
  document.getElementById('g-best').textContent=bestScore;
  document.getElementById('g-poin').textContent=sessionPoin;
  const msgs=[
    {e:'💨',t:'Kena Macet!',m:'Kalau naik Trans Batam, nggak bakal kena macet!'},
    {e:'😤',t:'Tersedak Polusi!',m:'Di dalam bus ber-AC udara lebih segar!'},
    {e:'🚗',t:'Kejebak Kemacetan!',m:'Trans Batam punya jalur khusus, lebih ngebut!'},
  ];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('g-over-emoji').textContent=msg.e;
  document.getElementById('g-over-title').textContent=msg.t;
  document.getElementById('g-over-msg').textContent=msg.m;
  setTimeout(()=>showOverlay('g-over'),320);
}
let lastTime=0;
function gameLoop(ts){
  if(!gameRunning) return;
  lastTime=ts;
  update(); render();
  RAF=requestAnimationFrame(gameLoop);
}
function update(){
  score++;
  document.getElementById('g-score').textContent=score;
  speed=5.5+Math.min(score/250,4.0);
  buildings.forEach(b=>{b.x-=speed*0.3; if(b.x+b.w<0){const l=buildings[buildings.length-1];b.x=(l?l.x+l.w+6:W)+Math.random()*10;b.h=60+Math.random()*150;}});
  laneMarkers.forEach(m=>{m.x-=speed;if(m.x+60<0)m.x+=12*120;});
  busTimer++;
  if(!busVisible&&busTimer>400){busVisible=true;busTimer=0;busX=W+60;}
  if(busVisible){busX-=speed*2.4;if(busX+130<0){busVisible=false;busTimer=0;}}
  spawnTimer++;
  if(spawnTimer>spawnInterval){spawnObstacle();spawnTimer=0;spawnInterval=Math.max(40,90-Math.floor(score/100)*3);}
  obstacles=obstacles.filter(o=>o.x>-220);
  for(const ob of obstacles){ob.x-=speed; ob.frame=(ob.frame||0)+1; if(collide(ob)){gameOver();return;}}
  if(!player.onGround){
    if(player.slamming){player.vy=Math.min(player.vy+GRAVITY*4, SLAM_VEL);} else {player.vy+=GRAVITY;}
    player.y+=player.vy;
    if(player.y>=groundY-player.h){const wasSlamming=player.slamming; player.y=groundY-player.h; player.vy=0; player.onGround=true; player.jumpCount=0; player.slamming=false; player.ducking=false; player.h=NORMAL_H; player.w=CHAR_W; if(wasSlamming) spawnSlamPfx();}
  }
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;});
}
function spawnObstacle(){
  const roll=Math.random(); let type;
  if(score<120) type='car'; else if(score<300) type=roll<.55?'car':'truck'; else type=roll<.35?'car':roll<.65?'truck':'barrier';
  const def=OBS[type]; let by;
  if(type==='barrier'){by = groundY - DUCK_H - def.h - 2;} else {by = groundY - def.h;}
  obstacles.push({x:W+90,y:by,w:def.w,h:def.h,type,frame:0});
}
function collide(ob){
  const m=8;
  return !(player.x+m > ob.x+ob.w-m || player.x+player.w-m < ob.x+m || player.y+m > ob.y+ob.h-m || player.y+player.h-m < ob.y+m);
}
function render(){ctx.clearRect(0,0,W,H); drawBg(); drawGround(); if(busVisible) drawBus(); obstacles.forEach(ob=>drawObstacle(ob)); particles.forEach(p=>{ctx.save(); ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.max),0,Math.PI*2); ctx.fill(); ctx.restore();}); drawPlayer(); drawHud();}
function drawBg(){const sg=ctx.createLinearGradient(0,0,0,groundY); sg.addColorStop(0,'#040814'); sg.addColorStop(1,'#111827'); ctx.fillStyle=sg; ctx.fillRect(0,0,W,groundY); stars.forEach(s=>{ctx.save(); ctx.globalAlpha=.3+s.a*.6; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); ctx.restore();}); buildings.forEach(b=>{const top=groundY-b.h; ctx.fillStyle='#0d1b40'; ctx.fillRect(b.x,top,b.w,b.h); const cols=Math.floor(b.w/13),rows=Math.floor(b.h/17); for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){if(Math.sin(b.x*0.1+c*77+r*43)>.25){ctx.fillStyle=`rgba(255,220,100,${.35+Math.random()*.35})`;ctx.fillRect(b.x+5+c*13,top+8+r*17,8,10);}} if(b.h>130){ctx.strokeStyle='rgba(37,99,235,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x+b.w/2,top);ctx.lineTo(b.x+b.w/2,top-18);ctx.stroke();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(b.x+b.w/2,top-18,2.5,0,Math.PI*2);ctx.fill();}});}
function drawGround(){ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,groundY,W,H-groundY); ctx.fillStyle='rgba(0,229,255,0.22)'; ctx.fillRect(0,groundY,W,2); ctx.fillStyle='#20203a'; ctx.fillRect(0,groundY+2,W,22); laneMarkers.forEach(m=>{ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(m.x,groundY+15,55,5);}); for(let i=0;i<7;i++){const lx=((i*175)-score*speed*0.004+W*4)%W; ctx.strokeStyle='#4B5563'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(lx,groundY); ctx.lineTo(lx,groundY-40); ctx.stroke(); ctx.beginPath(); ctx.moveTo(lx,groundY-40); ctx.lineTo(lx+12,groundY-40); ctx.stroke(); const g=ctx.createRadialGradient(lx+12,groundY-40,0,lx+12,groundY-40,16); g.addColorStop(0,'rgba(253,224,71,.2)'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(lx-4,groundY-56,32,32); ctx.fillStyle='rgba(253,224,71,.8)'; ctx.beginPath(); ctx.arc(lx+12,groundY-40,2.5,0,Math.PI*2); ctx.fill(); }}
function drawBus(){const bx=busX, by=groundY-68; const bg=ctx.createLinearGradient(bx,by,bx,by+68); bg.addColorStop(0,'#2563EB'); bg.addColorStop(1,'#1E40AF'); ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(bx,by,120,68,10); ctx.fill(); ctx.fillStyle='#FCD34D'; ctx.fillRect(bx,by+50,120,5); for(let i=0;i<4;i++){ctx.fillStyle='rgba(186,230,253,.6)';ctx.beginPath();ctx.roundRect(bx+12+i*27,by+10,22,18,4);ctx.fill();} ctx.fillStyle='white'; ctx.font='bold 9px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('TRANS BATAM',bx+60,by+44); ctx.textAlign='left'; [bx+20,bx+90].forEach(wx=>{ctx.fillStyle='#1f2937'; ctx.beginPath(); ctx.arc(wx,by+70,11,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.arc(wx,by+70,6,0,Math.PI*2); ctx.fill();}); ctx.fillStyle=`rgba(252,211,77,${.7+Math.sin(score*0.08)*.3})`; ctx.font='bold 15px sans-serif'; ctx.fillText('►',bx-24+Math.sin(score*0.08)*3,by+34);}
function drawObstacle(ob){ctx.save(); const {x,y,w,h,type,frame}=ob; const wr=h*0.22; if(type==='car'){ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x+w*.5,groundY+3,w*.43,5,0,0,Math.PI*2); ctx.fill(); const bg2=ctx.createLinearGradient(x,y+h*.35,x,y+h); bg2.addColorStop(0,'#fb923c'); bg2.addColorStop(1,'#b45309'); ctx.fillStyle=bg2; ctx.beginPath(); ctx.roundRect(x,y+h*.38,w,h*.62,10); ctx.fill(); const rg=ctx.createLinearGradient(x,y,x,y+h*.44); rg.addColorStop(0,'#fdba74'); rg.addColorStop(1,'#ea580c'); ctx.fillStyle=rg; ctx.beginPath(); ctx.roundRect(x+w*.12,y,w*.76,h*.46,10); ctx.fill(); ctx.fillStyle='rgba(186,230,253,.75)'; ctx.beginPath(); ctx.roundRect(x+w*.14,y+h*.04,w*.37,h*.36,6); ctx.fill(); ctx.fillStyle='rgba(186,230,253,.6)'; ctx.beginPath(); ctx.roundRect(x+w*.55,y+h*.05,w*.28,h*.33,5); ctx.fill(); ctx.strokeStyle='rgba(120,50,0,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+w*.5,y+h*.44); ctx.lineTo(x+w*.5,y+h*.98); ctx.stroke(); ctx.fillStyle='rgba(255,240,120,.9)'; ctx.beginPath(); ctx.roundRect(x+w*.88,y+h*.5,w*.1,h*.18,4); ctx.fill(); const hl=ctx.createRadialGradient(x+w,y+h*.58,0,x+w,y+h*.58,34); hl.addColorStop(0,'rgba(255,240,100,.3)'); hl.addColorStop(1,'transparent'); ctx.fillStyle=hl; ctx.fillRect(x+w-3,y+h*.38,42,h*.44); ctx.fillStyle='rgba(239,68,68,.85)'; ctx.beginPath(); ctx.roundRect(x,y+h*.5,w*.06,h*.18,3); ctx.fill(); [x+w*.2, x+w*.78].forEach(wx=>{ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(wx,groundY,wr,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(wx,groundY,wr*.85,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#8d8d8d'; ctx.beginPath(); ctx.arc(wx,groundY,wr*.52,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#c0c0c0'; ctx.beginPath(); ctx.arc(wx,groundY,wr*.2,0,Math.PI*2); ctx.fill(); for(let s=0;s<5;s++){const a=s/5*Math.PI*2+frame*.04; ctx.strokeStyle='#555'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(wx+Math.cos(a)*wr*.18,groundY+Math.sin(a)*wr*.18); ctx.lineTo(wx+Math.cos(a)*wr*.48,groundY+Math.sin(a)*wr*.48); ctx.stroke();}}); for(let i=0;i<5;i++){const sx=x-14-i*18,sy=y+h*.7-i*5; const smg=ctx.createRadialGradient(sx,sy,0,sx,sy,13+i*9); smg.addColorStop(0,`rgba(160,100,40,${.48-i*.08})`); smg.addColorStop(1,'transparent'); ctx.fillStyle=smg; ctx.beginPath(); ctx.arc(sx+Math.sin(frame*.08+i)*5,sy+Math.cos(frame*.06+i)*3,13+i*9,0,Math.PI*2); ctx.fill();} ctx.fillStyle='#fed7aa'; ctx.font='bold 11px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('🚗 POLUSI',x+w/2,y-8);
  } else if(type==='truck'){
    const wr2=h*.2; ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x+w*.5,groundY+3,w*.43,6,0,0,Math.PI*2); ctx.fill(); const cg=ctx.createLinearGradient(x,y+h*.08,x,y+h); cg.addColorStop(0,'#f87171'); cg.addColorStop(1,'#7f1d1d'); ctx.fillStyle=cg; ctx.beginPath(); ctx.roundRect(x,y+h*.08,w*.63,h*.92,8); ctx.fill(); ctx.strokeStyle='rgba(100,0,0,.4)'; ctx.lineWidth=2; for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(x+w*.06,y+h*(0.15+i*.2));ctx.lineTo(x+w*.58,y+h*(0.15+i*.2));ctx.stroke();} ctx.fillStyle='rgba(255,200,200,.6)'; ctx.font='bold 9px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('MUATAN BERAT',x+w*.32,y+h*.45); const cg2=ctx.createLinearGradient(x+w*.62,y,x+w*.62,y+h*.9); cg2.addColorStop(0,'#fca5a5'); cg2.addColorStop(1,'#dc2626'); ctx.fillStyle=cg2; ctx.beginPath(); ctx.roundRect(x+w*.62,y,w*.38,h,10); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.12)'; ctx.beginPath(); ctx.roundRect(x+w*.62,y+h*.55,w*.38,h*.06,2); ctx.fill(); ctx.fillStyle='rgba(186,230,253,.7)'; ctx.beginPath(); ctx.roundRect(x+w*.65,y+h*.06,w*.31,h*.4,6); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x+w*.67,y+h*.42); ctx.lineTo(x+w*.93,y+h*.3); ctx.stroke(); ctx.fillStyle='rgba(255,248,100,.95)'; ctx.beginPath(); ctx.roundRect(x+w*.91,y+h*.12,w*.07,h*.2,4); ctx.fill(); ctx.beginPath(); ctx.roundRect(x+w*.91,y+h*.38,w*.07,h*.15,3); ctx.fill(); const hb=ctx.createRadialGradient(x+w,y+h*.22,0,x+w,y+h*.22,52); hb.addColorStop(0,'rgba(255,248,100,.26)'); hb.addColorStop(1,'transparent'); ctx.fillStyle=hb; ctx.fillRect(x+w-4,y,58,h*.5); ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.roundRect(x+w*.95,y+h*.7,w*.05,h*.3,3); ctx.fill(); [x+w*.1, x+w*.36, x+w*.73, x+w*.9].forEach((wx,wi)=>{const wr3=wi>1?h*.18:wr2; ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(wx,groundY,wr3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#2d2d2d'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(wx,groundY,wr3*.86,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#5a5a5a'; ctx.beginPath(); ctx.arc(wx,groundY,wr3*.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(wx,groundY,wr3*.22,0,Math.PI*2); ctx.fill(); for(let s=0;s<6;s++){const a=s/6*Math.PI*2+frame*.045; ctx.strokeStyle='#3f3f3f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(wx+Math.cos(a)*wr3*.2,groundY+Math.sin(a)*wr3*.2); ctx.lineTo(wx+Math.cos(a)*wr3*.46,groundY+Math.sin(a)*wr3*.46); ctx.stroke();}}); ctx.fillStyle='#fca5a5'; ctx.font='bold 11px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('🚛 MACET',x+w/2,y-8);
  } else {
    const postW=13; const pg=ctx.createLinearGradient(x,y+h,x,groundY); pg.addColorStop(0,'#4b5563'); pg.addColorStop(1,'#1f2937'); ctx.fillStyle=pg; ctx.beginPath(); ctx.roundRect(x,y+h-4,postW,groundY-(y+h)+6,4); ctx.fill(); ctx.beginPath(); ctx.roundRect(x+w-postW,y+h-4,postW,groundY-(y+h)+6,4); ctx.fill(); ctx.fillStyle='#374151'; ctx.beginPath(); ctx.roundRect(x-3,y+h-7,postW+6,10,4); ctx.fill(); ctx.beginPath(); ctx.roundRect(x+w-postW-3,y+h-7,postW+6,10,4); ctx.fill(); ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.clip(); const sw=20; for(let sx=x-h;sx<x+w+h;sx+=sw*2){ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.moveTo(sx,y); ctx.lineTo(sx+sw,y); ctx.lineTo(sx+sw+h,y+h); ctx.lineTo(sx+h,y+h); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(sx+sw,y); ctx.lineTo(sx+sw*2,y); ctx.lineTo(sx+sw*2+h,y+h); ctx.lineTo(sx+sw+h,y+h); ctx.closePath(); ctx.fill();} ctx.restore(); ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.stroke(); ['#fde047','#ef4444','#fde047'].forEach((c,ri)=>{ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x+w*.25+ri*w*.25,y+h/2,5,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#1f2937'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x+w*.25+ri*w*.25,y+h/2,5,0,Math.PI*2); ctx.stroke();}); const pulse=.18+Math.sin(frame*.1)*.1; const wg=ctx.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,w*.65); wg.addColorStop(0,`rgba(250,204,21,${pulse})`); wg.addColorStop(1,'transparent'); ctx.fillStyle=wg; ctx.fillRect(x-20,y-20,w+40,h+40); ctx.fillStyle='#fef08a'; ctx.font='bold 11px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('⬇ JONGKOK!',x+w/2,y-9);
  }
  ctx.restore();
}
function drawPlayer(){const r=player, t=Date.now(); ctx.save(); ctx.translate(r.x+r.w/2, r.y+r.h/2); const auraCol=r.slamming?'rgba(255,100,0,.25)':'rgba(0,229,255,.14)'; const au=ctx.createRadialGradient(0,0,0,0,0,55); au.addColorStop(0,auraCol); au.addColorStop(1,'transparent'); ctx.fillStyle=au; ctx.fillRect(-35,-35,70,r.h+50); const ph=r.h, pw=r.w; if(r.slamming){ ctx.fillStyle='#00b4d8'; ctx.beginPath(); ctx.roundRect(-pw*.5,-ph*.25,pw,ph*.65,7); ctx.fill(); ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(pw*.45,0,pw*.44,0,Math.PI*2); ctx.fill(); for(let i=1;i<=5;i++){ ctx.save(); ctx.globalAlpha=.15*(6-i)/5; ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.roundRect(-pw*.5,-ph*.25-i*7,pw,ph*.65,7); ctx.fill(); ctx.restore(); } ctx.fillStyle='rgba(255,80,0,.9)'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText('⬇',-pw*.5,-ph*.45); } else if(r.ducking){ ctx.fillStyle='#00b4d8'; ctx.beginPath(); ctx.roundRect(-pw*.4,ph*.1,pw*.8,ph*.75,8); ctx.fill(); ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(pw*.3,-ph*.05,pw*.44,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(pw*.42,-ph*.09,2.5,0,Math.PI*2); ctx.fill(); } else { const la=r.onGround?Math.sin(t/78)*10:0; ctx.fillStyle='#0e7490'; ctx.beginPath(); ctx.roundRect(-pw*.4,ph*.2+la*.5,12,Math.max(4,ph*.18),5); ctx.fill(); ctx.beginPath(); ctx.roundRect(pw*.05,ph*.2-la*.5,12,Math.max(4,ph*.18),5); ctx.fill(); const bodyG=ctx.createLinearGradient(-pw*.4,-ph*.26,pw*.4,ph*.16); bodyG.addColorStop(0,'#00e5ff'); bodyG.addColorStop(1,'#0284c7'); ctx.fillStyle=bodyG; ctx.beginPath(); ctx.roundRect(-pw*.4,-ph*.26,pw*.8,ph*.55,7); ctx.fill(); ctx.fillStyle='#FCD34D'; ctx.fillRect(-pw*.4,-ph*.06,pw*.8,3); ctx.strokeStyle='#00e5ff'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-pw*.35,-ph*.14); ctx.lineTo(-pw*.55,-ph*.14+la*.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pw*.35,-ph*.14); ctx.lineTo(pw*.55,-ph*.14-la*.4); ctx.stroke(); ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(0,-ph*.38,pw*.46,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(0,229,255,.55)'; ctx.beginPath(); ctx.arc(0,-ph*.38-pw*.3,pw*.46,Math.PI,0); ctx.fill(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(pw*.12,-ph*.4,2.5,0,Math.PI*2); ctx.fill(); if(speed>7&&r.onGround){ ctx.strokeStyle='rgba(0,229,255,.38)'; ctx.lineWidth=1.5; for(let i=0;i<3;i++){ const ly=-ph*(.1-i*.15); ctx.beginPath(); ctx.moveTo(-pw*.4-i*4,ly); ctx.lineTo(-pw*.7-i*8,ly); ctx.stroke(); }} if(!r.onGround&&!r.slamming){ ctx.fillStyle='rgba(0,229,255,.65)'; ctx.font='bold 11px Sora,sans-serif'; ctx.textAlign='center'; ctx.fillText('↓ SLAM',-pw*.1,-ph*.62); } } ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,ph*.5+2,pw*.5,4,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function drawHud(){ ctx.font='bold 15px "DM Mono",monospace'; ctx.fillStyle='#00e5ff'; ctx.textAlign='right'; ctx.fillText(String(score).padStart(5,'0'),W-16,36); ctx.font='9px Sora,sans-serif'; ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillText('SKOR',W-16,50); ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.2)'; ctx.font='9px "DM Mono",monospace'; ctx.fillText('SPD '+speed.toFixed(1)+'x',14,36); }
function spawnDeathPfx(){ for(let i=0;i<24;i++){ const a=Math.random()*Math.PI*2,s=2+Math.random()*6; particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*6,color:['#00e5ff','#7c3aed','#f59e0b','#ef4444'][Math.floor(Math.random()*4)],life:45,max:45}); }}
function spawnSlamPfx(){ for(let i=0;i<14;i++){ const a=Math.PI+Math.random()*Math.PI, s=1.5+Math.random()*4; particles.push({x:player.x+player.w/2+Math.cos(a)*20,y:groundY-4,vx:Math.cos(a)*s*1.5,vy:-Math.random()*3,r:3+Math.random()*5,color:['#00e5ff','#0ea5e9','#7c3aed'][Math.floor(Math.random()*3)],life:28,max:28}); }}
function doJump(){ if(gamePhase==='idle'||gamePhase==='dead'){gameStart();return;} if(!gameRunning) return; if(player.jumpCount<2){ player.vy=JUMP_FORCE; player.onGround=false; player.jumpCount++; player.ducking=false; player.slamming=false; player.h=NORMAL_H; player.w=CHAR_W; player.y=Math.min(player.y,groundY-player.h);} }
function doDown(){ if(!gameRunning) return; if(!player.onGround&&!player.slamming){ player.slamming=true; player.vy=SLAM_VEL; player.ducking=false; player.h=NORMAL_H; player.w=CHAR_W; } else if(player.onGround&&!player.ducking){ const prev=player.h; player.ducking=true; player.h=DUCK_H; player.w=CHAR_W; player.y+=prev-DUCK_H; }}
function doDownEnd(){ if(!gameRunning) return; if(player.ducking&&player.onGround){ const prev=player.h; player.ducking=false; player.h=NORMAL_H; player.w=CHAR_W; player.y-=NORMAL_H-prev; }}
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump();} if(e.code==='ArrowDown'){e.preventDefault();doDown();}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowDown')doDownEnd();});
canvas.addEventListener('click',doJump);
canvas.addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
window.addEventListener('resize',initGame);
initGame();
function setNavActive(){ const current = window.location.pathname.split('/').pop() || 'index.html'; document.querySelectorAll('.nav-links a').forEach(link=>{ link.classList.remove('active'); const href = link.getAttribute('href'); if(!href) return; const file = href.split('/').pop(); if(file === current){ link.classList.add('active'); }});} window.addEventListener('load', setNavActive);
</script>
