<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(90deg, #050C9C, #0d6efd);
            font-family: 'Roboto', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            transition: transform 0.3s ease-in-out;
        }

        .login-container:hover {
            transform: scale(1.02); /* Sedikit membesar saat hover */
        }

        .login-header {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .form-control {
            height: 50px;
            padding: 15px;
            font-size: 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.5);
        }

        .btn-primary {
            background-color: rgb(8, 39, 242);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-primary:hover {
            background-color: #062db3; /* Warna lebih gelap */
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(8, 39, 242, 0.3);
        }

        .btn-back {
            margin-top: 10px;
            background-color: #f1f1f1;
            color: #333;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #e2e2e2;
        }

        .alert {
            font-size: 14px;
            margin-top: 20px;
            border-radius: 12px;
        }

        .logo {
            max-width: 150px;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            transition: transform 0.3s ease-in-out;
        }

        .logo:hover {
            transform: scale(1.1); /* Logo sedikit membesar saat hover */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <a class="navbar-brand d-flex justify-content-center">
            <img src="../assets/Logo.png" alt="Logo PGN" class="logo">
        </a>
        <h3 class="login-header text-center">Form Login</h3>
        <div class="alert alert-danger text-center">
            Username atau password salah!
        </div>
        <form method="post">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="d-grid gap-2">
                <a href="index.html" class="btn btn-primary">Login</a>
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
        <div class="text-center mt-3">
        </div>
    </div>
</body>
</html>
